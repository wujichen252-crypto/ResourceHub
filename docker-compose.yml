version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resourcehub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ENV=production
      - DEBUG=false
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - backend-data:/app/data
    networks:
      - resourcehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resourcehub-frontend
    restart: unless-stopped
    ports:
      - "9200:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - resourcehub-network

volumes:
  backend-data:

networks:
  resourcehub-network:
    driver: bridge

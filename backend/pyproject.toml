[project]
name = "resourcehub-backend"
version = "0.1.0"
description = "ResourceHub 后端服务 — FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy[asyncio]==2.0.35",
    "aiosqlite==0.20.0",
    "alembic==1.13.2",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    "python-multipart==0.0.12",
    "aiomysql>=0.3.2",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
# 与 requires-python 对齐，避免建议不兼容的语法
target-version = "py310"
line-length = 100
# 迁移脚本由 Alembic 生成，不纳入风格检查
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/W 常规错误、F 逻辑错误、I 导入排序、B 潜在缺陷、UP 语法升级、C4 推导式优化
select = ["E", "W", "F", "I", "B", "UP", "C4"]
# 行宽由 formatter 处理，交给 E501 会与长 URL 等场景冲突
# B008：FastAPI 以 Depends()/Query() 作默认参数是官方范式，非缺陷
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]


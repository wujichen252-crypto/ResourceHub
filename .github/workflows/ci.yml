name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一分支重复推送时取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      # --frozen 在 uv.lock 与 pyproject.toml 不一致时直接失败，防止依赖漂移
      - name: 安装依赖
        run: uv sync --frozen

      - name: 代码静态检查
        run: uvx ruff check .

      - name: 运行测试
        run: uv run pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 构建包含 vue-tsc 类型检查，类型错误会阻断流水线
      - name: 类型检查与构建
        run: npm run build
